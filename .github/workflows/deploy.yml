name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - name: Skip until FTP secrets are set
        if: env.FTP_SERVER == ''
        run: echo "FTP secrets are not set yet, nothing was deployed."
      - uses: actions/checkout@v4
        if: env.FTP_SERVER != ''
      - name: Build Ukrainian page (uk/index.html)
        if: env.FTP_SERVER != ''
        run: node scripts/build-uk.js
      - name: Write server config for the assessment (from secrets, never committed)
        if: env.FTP_SERVER != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASSESSMENT_SHEET_URL: ${{ secrets.ASSESSMENT_SHEET_URL }}
        run: |
          php -r 'file_put_contents("inc/config.php", "<?php\nreturn " . var_export(["anthropic_key" => getenv("ANTHROPIC_API_KEY") ?: "", "sheet_url" => getenv("ASSESSMENT_SHEET_URL") ?: ""], true) . ";\n");'
      - name: Upload site over FTPS
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ${{ secrets.FTP_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            scripts/**
            README.md
